[project]
name = "memoryrush"
version = "0.3.0"
description = "Local-first reading memory retrieval system."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "streamlit>=1.64,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]

[project.scripts]
memoryrush = "memoryrush.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
